name: Public Action checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test action/test.js
