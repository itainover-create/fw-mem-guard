name: Publish public support pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: support-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage public documentation only
        run: |
          mkdir site
          cp index.html TRY_IT.html COMPARE_FIRMWARE_BUILDS.html FIRMWARE_MEMORY_BUDGETS.html REAL_FIRMWARE.html START_HERE_EN.html SUPPORT.html PRIVACY.html site.css robots.txt site/
          if [ -f sitemap.xml ]; then cp sitemap.xml site/; fi
          mkdir site/samples
          for asset in BUILD_FROM_SOURCE.md FROZEN_PYTHON_NOTICES.txt MICROPYTHON_LIB_LICENSE.txt baseline-objdump.txt build-receipt.json build_from_source.py change.patch check_sections.py checker-negative-control.txt current-objdump.txt micropython-f411-v1.24.1.zip micropython-f411-v1.24.1.zip.sha256 ram-growth-4095-profile.json ram-growth-4095.json ram-growth-4095.txt ram-growth-restored-4096.json rebuild-submodules.txt rebuilt-baseline-objdump.txt rebuilt-current-objdump.txt verification.json verified-reference-sections.csv; do
            cp "samples/$asset" site/samples/
          done
          mkdir site/media
          for asset in icon.png store-hero.png demo-poster.png demo-preview.gif fw-mem-guard-demo.mp4 demo-en.vtt demo-transcript.html demo-result.json demo-output.txt demo-evidence.json; do
            cp "media/$asset" site/media/
          done
          if [ -f screenshots/guided-setup.png ]; then
            mkdir -p site/screenshots
            cp screenshots/guided-setup.png site/screenshots/
          fi
          if [ -f screenshots/budget-report.png ]; then
            mkdir -p site/screenshots
            cp screenshots/budget-report.png site/screenshots/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
